name: Deploy Frontend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TARGET_DIR: /var/www/html/sandbox/acensure/frontend
  SERVER_PORT: 22

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend on server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ env.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ env.TARGET_DIR }}"

            git fetch origin
            git reset --hard "${{ github.sha }}"

            test -f docker-compose.yml
            test -f Dockerfile
            test -f nginx.conf
            test -f package.json

            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
